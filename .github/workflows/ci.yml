name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend and ML unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install (no TensorFlow; tests use test doubles)
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt scikit-learn ruff
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Byte-compile everything, including TensorFlow-only modules
        run: python -m compileall -q backend ml
      - name: Tests
        run: pytest

  frontend:
    name: Frontend typecheck, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
